[package]
name = "solver_rs"
version = "0.1.0"
edition = "2021"
description = "Rust kernel prototype for minclass_solver hot path (equivalence merge + domain propagation)"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "thin"
debug = false

[[bin]]
name = "solver_rs"
path = "src/main.rs"
